<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>تنظیمات RTL Everywhere</title><style>body{font:16px sans-serif;max-width:600px;margin:40px auto;padding:0 20px}label{display:flex;gap:8px}</style></head><body><h1>RTL Everywhere</h1><label><input id="enabled" type="checkbox" checked> فعال‌سازی راست‌چین</label><script>const c=document.getElementById('enabled');c.checked=localStorage.getItem('rtl-everywhere-enabled')!=='false';c.onchange=()=>localStorage.setItem('rtl-everywhere-enabled',String(c.checked));</script></body></html>
